name: Verify repository
on:
  push:
  pull_request:
jobs:
  data-and-metrics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-cpu.txt
      - run: python scripts/audit_data.py
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_pipeline.py --dry-run
      - run: bash -n scripts/run_pipeline.sh
  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-training.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_test_training.py
      - run: python -m pip install lm-eval==0.4.8
      - run: python scripts/verify_tasks.py
